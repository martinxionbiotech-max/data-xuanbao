{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://xuanbaoenvironment.com/#organization",
    "name": "Yancheng Xuanbao Environmental Technology Co., Ltd.",
    "alternateName": "Xuanbao Environmental Technology",
    "url": "https://xuanbaoenvironment.com",
    "sameAs": [
      "https://data.xuanbaoenvironment.com"
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://data.xuanbaoenvironment.com/#website",
    "name": "Xuanbao Industrial Materials Knowledge Center",
    "url": "https://data.xuanbaoenvironment.com",
    "inLanguage": "en",
    "publisher": {
      "@id": "https://xuanbaoenvironment.com/#organization"
    }
  }
  </script>
  {% if page and page.url and page.url != '' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{{ 'CollectionPage' if page.is_index else ('WebPage' if page.is_homepage else 'TechArticle') }}",
    "headline": "{{ page.title | replace('"', '\\"') }}",
    "url": "{{ page.canonical_url }}",
    "inLanguage": "en",
    {% if page.meta and page.meta.description %}
    "description": "{{ page.meta.description | replace('"', '\\"') | replace('\n', ' ') | trim }}",
    {% endif %}
    "dateModified": "{{ build_date_utc.strftime('%Y-%m-%d') }}",
    "publisher": {
      "@id": "https://xuanbaoenvironment.com/#organization"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ page.canonical_url }}"
    }
  }
  </script>
  {% if page.ancestors %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://data.xuanbaoenvironment.com/"
      }
      {% for ancestor in page.ancestors %}
      ,{
        "@type": "ListItem",
        "position": {{ loop.index + 1 }},
        "name": "{{ ancestor.title | replace('"', '\\"') }}",
        "item": "{{ ancestor.url | url }}"
      }
      {% endfor %}
      ,{
        "@type": "ListItem",
        "position": {{ page.ancestors | length + 2 }},
        "name": "{{ page.title | replace('"', '\\"') }}",
        "item": "{{ page.canonical_url }}"
      }
    ]
  }
  </script>
  {% endif %}
  {% endif %}
{% endblock %}

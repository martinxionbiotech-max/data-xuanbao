{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <style>
    .md-footer-contact {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      color: var(--md-footer-fg-color--light);
      font-size: 0.7rem;
      line-height: 1.4;
    }
    .md-footer-contact__btn {
      display: inline-flex;
      align-items: center;
      background-color: #25D366;
      color: #ffffff;
      font-weight: 600;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .md-footer-contact__btn:hover {
      background-color: #1ebe5b;
      color: #ffffff;
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://xuanbaoenvironment.com/#organization",
    "name": "Yancheng Xuanbao Environmental Technology Co., Ltd.",
    "alternateName": "Xuanbao Environmental Technology",
    "url": "https://xuanbaoenvironment.com",
    "sameAs": [
      "https://data.xuanbaoenvironment.com"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "sales",
      "name": "Joanna D.",
      "telephone": "+86-15153588090",
      "email": "joanna@dinweys.com",
      "availableLanguage": ["en", "zh"]
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://data.xuanbaoenvironment.com/#website",
    "name": "Xuanbao Industrial Materials Knowledge Center",
    "url": "https://data.xuanbaoenvironment.com",
    "inLanguage": "en",
    "publisher": {
      "@id": "https://xuanbaoenvironment.com/#organization"
    }
  }
  </script>
  {% if page and page.url and page.url != '' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{{ 'CollectionPage' if page.is_index else ('WebPage' if page.is_homepage else 'TechArticle') }}",
    "headline": "{{ page.title | replace('"', '\\"') }}",
    "url": "{{ page.canonical_url }}",
    "inLanguage": "en",
    {% if page.meta and page.meta.description %}
    "description": "{{ page.meta.description | replace('"', '\\"') | replace('\n', ' ') | trim }}",
    {% endif %}
    "dateModified": "{{ build_date_utc.strftime('%Y-%m-%d') }}",
    "publisher": {
      "@id": "https://xuanbaoenvironment.com/#organization"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ page.canonical_url }}"
    }
  }
  </script>
  {% if page.ancestors %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://data.xuanbaoenvironment.com/"
      }
      {% for ancestor in page.ancestors %}
      ,{
        "@type": "ListItem",
        "position": {{ loop.index + 1 }},
        "name": "{{ ancestor.title | replace('"', '\\"') }}",
        "item": "{{ ancestor.url | url }}"
      }
      {% endfor %}
      ,{
        "@type": "ListItem",
        "position": {{ page.ancestors | length + 2 }},
        "name": "{{ page.title | replace('"', '\\"') }}",
        "item": "{{ page.canonical_url }}"
      }
    ]
  }
  </script>
  {% endif %}
  {% endif %}
{% endblock %}
